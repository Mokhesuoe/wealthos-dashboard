name: Deploy WealthOS dashboard

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: wealthos-dashboard-pages
  cancel-in-progress: true

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node for release checks
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Test WealthOS dashboard before deployment
        run: |
          node tests/dashboard-release-check.cjs
          node tests/capital-creation-v06.test.cjs
          node tests/capital-evidence-v07.test.cjs
          node tests/capital-allocation-v08.test.cjs

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload dashboard artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: .

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-24.04
    needs: build
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Verify published dashboard over HTTPS
        env:
          PAGE_URL: ${{ steps.deployment.outputs.page_url }}
        run: |
          test -n "$PAGE_URL"
          success=0
          for attempt in 1 2 3 4 5 6; do
            if curl --location --fail --silent --show-error --max-time 20 "$PAGE_URL" --output "$RUNNER_TEMP/wealthos-deployed.html"; then
              if grep -q 'id="authPanel"' "$RUNNER_TEMP/wealthos-deployed.html" &&
                 grep -q 'id="capitalPanel"' "$RUNNER_TEMP/wealthos-deployed.html" &&
                 grep -q 'capital-v05.js?v=05' "$RUNNER_TEMP/wealthos-deployed.html" &&
                 grep -q 'id="creationStudio"' "$RUNNER_TEMP/wealthos-deployed.html" &&
                 grep -q 'capital-creation-v06.js?v=06' "$RUNNER_TEMP/wealthos-deployed.html" &&
                 grep -q 'id="evidencePanel"' "$RUNNER_TEMP/wealthos-deployed.html" &&
                 grep -q 'capital-evidence-v07.js?v=07' "$RUNNER_TEMP/wealthos-deployed.html" &&
                 grep -q 'id="allocationPanel"' "$RUNNER_TEMP/wealthos-deployed.html" &&
                 grep -q 'capital-allocation-v08.js?v=08' "$RUNNER_TEMP/wealthos-deployed.html" &&
                 grep -q 'LIVE CAPITAL LOCKED' "$RUNNER_TEMP/wealthos-deployed.html" &&
                 curl --location --fail --silent --show-error --max-time 20 "${PAGE_URL%/}/capital-v05.js?v=05" --output "$RUNNER_TEMP/wealthos-capital.js" &&
                 grep -q 'WealthOSCapitalV05' "$RUNNER_TEMP/wealthos-capital.js" &&
                 curl --location --fail --silent --show-error --max-time 20 "${PAGE_URL%/}/capital-creation-v06.js?v=06" --output "$RUNNER_TEMP/wealthos-creation.js" &&
                 grep -q 'WealthOSCreationV06' "$RUNNER_TEMP/wealthos-creation.js" &&
                 curl --location --fail --silent --show-error --max-time 20 "${PAGE_URL%/}/capital-evidence-v07.js?v=07" --output "$RUNNER_TEMP/wealthos-evidence.js" &&
                 grep -q 'WealthOSEvidenceV07' "$RUNNER_TEMP/wealthos-evidence.js" &&
                 curl --location --fail --silent --show-error --max-time 20 "${PAGE_URL%/}/capital-allocation-v08.js?v=08" --output "$RUNNER_TEMP/wealthos-allocation.js" &&
                 grep -q 'WealthOSAllocationV08' "$RUNNER_TEMP/wealthos-allocation.js"; then
                echo "Published WealthOS HTML verified at $PAGE_URL"
                success=1
                break
              fi
            fi
            echo "Public shell not ready, attempt $attempt"
            sleep 10
          done
          test "$success" -eq 1
