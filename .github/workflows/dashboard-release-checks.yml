name: WealthOS Dashboard Release Checks
on:
  push:
    paths:
      - index.html
      - tests/dashboard-release-check.cjs
      - .github/workflows/dashboard-release-checks.yml
  pull_request:
    paths:
      - index.html
      - tests/dashboard-release-check.cjs
      - .github/workflows/dashboard-release-checks.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  release-checks:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate dashboard and capital arithmetic
        run: node tests/dashboard-release-check.cjs
