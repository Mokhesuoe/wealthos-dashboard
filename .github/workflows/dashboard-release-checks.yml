name: WealthOS Dashboard Release Checks
on:
  push:
    paths:
      - index.html
      - capital-v05.js
      - capital-creation-v06.js
      - capital-evidence-v07.js
      - capital-allocation-v08.js
      - tests/capital-allocation-v08.test.cjs
      - tests/capital-evidence-v07.test.cjs
      - tests/capital-creation-v06.test.cjs
      - tests/dashboard-release-check.cjs
      - .github/workflows/dashboard-release-checks.yml
  pull_request:
    paths:
      - index.html
      - capital-v05.js
      - capital-creation-v06.js
      - capital-evidence-v07.js
      - capital-allocation-v08.js
      - tests/capital-allocation-v08.test.cjs
      - tests/capital-evidence-v07.test.cjs
      - tests/capital-creation-v06.test.cjs
      - tests/dashboard-release-check.cjs
      - .github/workflows/dashboard-release-checks.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  release-checks:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate dashboard and capital arithmetic
        run: |
          node tests/dashboard-release-check.cjs
          node tests/capital-creation-v06.test.cjs
          node tests/capital-evidence-v07.test.cjs
          node tests/capital-allocation-v08.test.cjs
